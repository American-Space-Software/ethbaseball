<template es>

  <main class="page" data-name="offers">

    <div class="page-content">

      <div class="fixed-width-content center">

        <div class="block">
          <p class="segmented">
            <a href="/offers" class="button button-outline tab-link tab-link-active">All Listings</a>
            <a href="/offers/user" class="button button-outline tab-link">Your Listings</a>
          </p>
        </div>

        <table class="data-table players">
          <thead>
            <tr>
              <th class="image"></th>
              <th class="name label-cell">Name</th>
              <th>Seller</th>
              <th class="numeric-cell">Cost</th>

            </tr>
          </thead>

          <tbody>
            ${offers.length > 0 ? $h`

              ${offers.map((offer) => $h`
                <tr>
                  <td class="image">
                    <span class="icon">
                      <img src="/player/image/${offer.salePlayer._id}" />
                      <span class="badge ${playerWebService.getRatingBadgeColor(offer.salePlayer.overallRating)} overall-badge">
                        ${playerWebService.ratingToGrade(offer.salePlayer.overallRating)}
                      </span>
                    </span>
                  </td>

                  <td class="name">
                    <a href="${universeWebService.startDateLink(`/p/${offer.salePlayer._id}`)}">
                      ${offer.salePlayer.fullName || offer.salePlayer.name}
                    </a><br />
                    <span class="position">${offer.salePlayer.primaryPosition}</span>
                  </td>




                  <td class="seller">
                    <a href="${universeWebService.startDateLink(`/t/${offer.sellerPaymentTeam._id}`)}">
                      ${offer.sellerPaymentTeam.name}
                    </a>
                  </td>

                  <td class="numeric-cell">
                    ${universeWebService.displayDiamonds(offer.diamondAmount)}
                  </td>

                </tr>
              `)}

            ` : $h`
              <tr>
                <td colspan="5">No active sales listings.</td>
              </tr>
            `}
          </tbody>
        </table>

      </div>

    </div>

  </main>

</template>

<style>

</style>

<script>

  import Navbar from "../common/navbar.f7.html"
  import Breadcrumbs from "../common/breadcrumbs.f7.html"
  import Toolbar from "../common/toolbar.f7.html"

  import { ContainerService } from "../../../service/container-service"
  import { UniverseWebService } from "../../service/universe-web-service.ts"
  import { PlayerWebService } from "../../service/player-web-service.ts"

  export default (props, { $, $on, $f7, $h, $update }) => {

    let env = ContainerService.getInstance("env")()
    let eventTarget = ContainerService.getInstance("eventTarget")
    let playerWebService = ContainerService.getInstance(PlayerWebService)
    let universeWebService = ContainerService.getInstance(UniverseWebService)

    let authInfo = props.authInfo
    let offers = props.offers

    const badge = (rating) => {
      if (rating == null) return ""
      return $h`<span class="badge ${playerWebService.getRatingBadgeColor(rating)}">${playerWebService.ratingToGrade(rating)}</span>`
    }

    $on('pageBeforeIn', async (e) => {

      eventTarget.dispatchEvent(new CustomEvent('main-nav', {
        detail: {
          visible: false,
          tabLink: "/offers",
          breadcrumbs: [{ text: "Offers", path: "/offers" }]
        }
      }))

      universeWebService.setMetadata(
        `Offers – Ethereum Baseball League`,
        window.location.href,
        `${env.WEB}/logo.png`,
        "Offers in Ethereum Baseball League."
      )

      await $update()
    })

    return $render
  }

</script>
