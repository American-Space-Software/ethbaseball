<template>

  <div class="page" data-name="game-complete">


    <div class="page-content game-complete-page">

        ${gameViewModel?.game ? $h`

            <div class="fixed-width-content center">

              <div class="block-title">Final Score</div>

              <div class="game-banner">

                  <div class="away ${gameViewModel?.game.isComplete && gameViewModel?.game.score.away > gameViewModel?.game.score.home ? $h`winner` : $h` `}">

                    <div class="name">

                      <a href="${universeWebService.startDateLink(`/t/index/${gameViewModel.game.away._id}`)}">
                        <img src="/image/thumbnail/100/${gameViewModel?.game.away.logoId}" class="profilePic" />
                        <span class="record">${gameViewModel?.game.away.overallRecord.after?.wins || gameViewModel?.game.away.overallRecord.before?.wins}-${gameViewModel?.game.away.overallRecord.after?.losses || gameViewModel?.game.away.overallRecord.before?.losses}<br /></span>


                        ${teamWebService.getTeamName(gameViewModel?.game.away)}

                      </a>

                    </div>
                    <div class="runs">${gameViewModel?.game.score.away}</div>
                  </div>

                  <div class="home ${gameViewModel?.game.isComplete && gameViewModel?.game.score.home > gameViewModel?.game.score.away ? $h`winner` : $h` `}">
                    
                    <div class="runs">${gameViewModel?.game.score.home}</div>
                    
                    <div class="name">

                      <a href="${universeWebService.startDateLink(`/t/index/${gameViewModel.game.home._id}`)}">
                        <img src="/image/thumbnail/100/${gameViewModel?.game.home.logoId}" class="profilePic" />
                        <span class="record">${gameViewModel?.game.home.overallRecord.after?.wins || gameViewModel?.game.home.overallRecord.before?.wins}-${gameViewModel?.game.home.overallRecord.after?.losses || gameViewModel?.game.home.overallRecord.before?.losses}<br /></span>
                        
                        
                        ${teamWebService.getTeamName(gameViewModel?.game.home)}
                      </a>

                    </div>
                    
                  </div>

                  <div class="linescore-wrapper">
                    <table class="linescore">
                      <thead>
                        <tr>
                          <th></th>
                          ${Array.from({length: Math.max(9, gameViewModel.game.currentInning)}, (_, i) => i + 1).map( num => $h`
                            <th>${num}</th>                          
                          `)}
                  
                          <th>R</th>
                          <th>H</th>
                          <th>E</th>        
                        </tr>
                      </thead>
                      <tbody>
                        <tr>

                          <td class="abbrev">
                            <img src="/image/thumbnail/${gameViewModel?.game.away.logoId}" class="profilePic" />
                          </td>
                  
                          ${Array.from({length: Math.max(9, gameViewModel.game.currentInning)}, (_, i) => i + 1).map( num => $h`
                            <td class="align-center ${!gameViewModel.game.isComplete && gameViewModel.game.currentInning == num && gameViewModel.linescoreViewModel.isTopInning ? $h`current` : ` `}">${gameViewModel.linescoreViewModel.linescore.away[num]}</td>                        
                          `)}
                  
                          <td class="align-center ${gameViewModel?.game.isComplete ? $h`linescore-strong` : $h` `}">${gameViewModel.linescoreViewModel.linescore.away[gameViewModel.linescoreViewModel.linescore.away.length - 3]}</td>
                          <td class="align-center ${gameViewModel?.game.isComplete ? $h`linescore-strong` : $h` `}">${gameViewModel.linescoreViewModel.linescore.away[gameViewModel.linescoreViewModel.linescore.away.length - 2]}</td>
                          <td class="align-center ${gameViewModel?.game.isComplete ? $h`linescore-strong` : $h` `}">${gameViewModel.linescoreViewModel.linescore.away[gameViewModel.linescoreViewModel.linescore.away.length - 1]}</td>
                        </tr>
                        <tr>
                      
                          <td class="abbrev">
                            <img src="/image/thumbnail/${gameViewModel?.game.home.logoId}" class="profilePic" /> ${gameViewModel.game.home.abbrev}
                          </td>
                      
                          ${Array.from({length: Math.max(9, gameViewModel.game.currentInning)}, (_, i) => i + 1).map( num => $h`
                            <td class="align-center ${!gameViewModel.game.isComplete && gameViewModel.game.currentInning == num && !gameViewModel.linescoreViewModel.isTopInning ? $h`current` : ` `}">${gameViewModel.linescoreViewModel.linescore.home[num]}</td>                        
                          `)}
                  
                          <td class="align-center ${gameViewModel?.game.isComplete ? $h`linescore-strong` : $h` `}">${gameViewModel.linescoreViewModel.linescore.home[gameViewModel.linescoreViewModel.linescore.home.length - 3]}</td>
                          <td class="align-center ${gameViewModel?.game.isComplete ? $h`linescore-strong` : $h` `}">${gameViewModel.linescoreViewModel.linescore.home[gameViewModel.linescoreViewModel.linescore.home.length - 2]}</td>
                          <td class="align-center ${gameViewModel?.game.isComplete ? $h`linescore-strong` : $h` `}">${gameViewModel.linescoreViewModel.linescore.home[gameViewModel.linescoreViewModel.linescore.home.length - 1]}</td>
                        </tr>
                      </tbody>	
                    </table>
                  </div>

              </div>

              ${summary ? $h`
                <div class="block block-strong block-outline" innerHTML="${summary}"></div>  
              ` : $h` `}

              <div class="grid grid-cols-1 large-grid-cols-2">
                  <${Boxscore} substitutions=${gameViewModel?.game?.substitutions} vm=${getAwayBoxscoreViewModel} />
                  <${Boxscore} substitutions=${gameViewModel?.game.substitutions} vm=${getHomeBoxscoreViewModel} />
              </div> 
              
              <div class="list media-list list-outline-ios list-strong-ios list-dividers-ios">
                  <ul>
                      <li>
                          <a href="/g/${gameViewModel.game._id}/gamelog" class="item-link item-content">
                              <div class="item-media">🏟️</div>

                              <div class="item-inner">
                                  <div class="item-title-row">
                                    <div class="item-title">
                                        View Game Log
                                    </div>
                                  </div>
                              </div>
                          </a>
                      </li>
                  </ul>
              </div>


            </div>



        ` : $h`
          <div class="block">
            No game found.
          </div>
        `}

    </div>

  </div>

</template>

<script>


  import Navbar from "../common/navbar.f7.html"
  import LineScore from "./linescore.f7.html"
  import GameState from "./game-state.f7.html"



  import dayjs from "dayjs"

  import { ContainerService } from "../../../service/container-service.ts"
  import { GameWebService } from "../../service/game-web-service.ts"
  import { UniverseWebService } from "../../service/universe-web-service.ts"
  import { TeamWebService } from "../../service/team-web-service.ts"
  import { QuillWebService } from "../../service/quill-web-service.ts"
  import { PlayerWebService } from "../../service/player-web-service.ts"
  import { BoxscoreService } from "../../service/boxscore-service.ts"

  import { Position } from 'baseball-sim-engine';

  const arrayToStr = (arr) => {

    let mapped = arr.map( v => `${v.name} ${v.value > 1 ? `${v.value}` : ``}`.trim())
    return `${mapped.join("; ")}`
  }

  const Boxscore = (props, { $on, $, $f7, $h, $update }) => {

    let universeWebService = ContainerService.getInstance(UniverseWebService)
    let teamWebService = ContainerService.getInstance(TeamWebService)
    let playerWebService = ContainerService.getInstance(PlayerWebService)
    let boxscoreService = ContainerService.getInstance(BoxscoreService)

    let vm = props.vm()

    let substitutions = props.substitutions
    let info = boxscoreService.getBoxscoreInfo(substitutions, vm)

    let batters = info.batters
    let pitchers = info.pitchers
    let doubles = info.doubles
    let triples = info.triples
    let hr = info.hr
    let tb = info.tb
    let rbi = info.rbi

    $f7.on('gameUpdate', () => {

      Object.assign(vm, props.vm())
      Object.assign(substitutions, props.substitutions)

      let info = boxscoreService.getBoxscoreInfo(substitutions, vm)

      batters = info.batters
      pitchers = info.pitchers
      doubles = info.doubles
      triples = info.triples
      hr = info.hr
      tb = info.tb
      rbi = info.rbi

      $update()
    })

    return () => $h`<div class="block block-outline block-strong">
        <div class="block-header">${teamWebService.getTeamName(vm.teamInfo)}</div>

        <div class="stat-table-wrapper">
          <table class="data-table small-font game-table">
            <thead>
              <tr>
                <th class="image"></th>
                <th class="name">Batting</th>
                <th class="numeric-cell">POS</th>
                <th class="numeric-cell">AB</th>
                <th class="numeric-cell">R</th>
                <th class="numeric-cell">H</th>
                <th class="numeric-cell">2B</th>
                <th class="numeric-cell">3B</th>
                <th class="numeric-cell">HR</th>
                <th class="numeric-cell">RBI</th>
                <th class="numeric-cell">BB</th>
                <th class="numeric-cell">HBP</th>
                <th class="numeric-cell">SO</th>
                <th class="numeric-cell">WPA</th>       
              </tr>                
            </thead>
            <tbody>
              ${batters.map((row, index) => $h`
                <tr class="${vm.teamInfo.lineupIds[vm.teamInfo.currentHitterIndex] == row.player._id && !vm.isComplete ? $h`${vm.isTopInning && vm.homeaway == 'AWAY' || !vm.isTopInning && vm.homeaway == 'HOME' ? $h`at-bat` : $h`at-bat-next`}` : $h``}">
                  <td class="image">
                    <span class="icon">
                      <img src="/player/image/${row.player._id}" />

                    </span>
                  </td>

                  <td class="name">
                    ${row.subNumber ? $h`${row.subNumber}-` : $h``}
                    <a href="${universeWebService.startDateLink(`/p/${row.player._id}`)}">${row.player.fullName}</a>
                  </td>

                  <td class="pos">${row.player.currentPosition}</td>
                  <td class="numeric-cell">${row.player.hitResult.atBats}</td>
                  <td class="numeric-cell">${row.player.hitResult.runs}</td>
                  <td class="numeric-cell">${row.player.hitResult.hits}</td>
                  <td class="numeric-cell">${row.player.hitResult.doubles}</td>
                  <td class="numeric-cell">${row.player.hitResult.triples}</td>
                  <td class="numeric-cell">${row.player.hitResult.homeRuns}</td>
                  <td class="numeric-cell">${row.player.hitResult.rbi}</td>
                  <td class="numeric-cell">${row.player.hitResult.bb}</td>
                  <td class="numeric-cell">${row.player.hitResult.hbp}</td>
                  <td class="numeric-cell">${row.player.hitResult.so}</td>
                  <td class="numeric-cell">${row.player.hitResult.wpa?.toFixed(2)}</td>
                </tr>
              `)}
            </tbody>                            
          </table>
        </div>

        <div class="stat-table-wrapper">
          <table class="data-table small-font game-table">
            <thead>
              <tr>
                <th class="image"></th>
                <th>Pitching</th>
                <th class="pos">POS</th>
                <th class="numeric-cell">W</th>
                <th class="numeric-cell">L</th>
                <th class="numeric-cell">IP</th>
                <th class="numeric-cell">H</th>
                <th class="numeric-cell">R</th>
                <th class="numeric-cell">ER</th>
                <th class="numeric-cell">HR</th>
                <th class="numeric-cell">BB</th>
                <th class="numeric-cell">SO</th>
                <th class="numeric-cell">HBP</th>
                <th class="numeric-cell">BF</th>     
                <th class="numeric-cell">PIT</th>                  
                <th class="numeric-cell">STR</th>    
                <th class="numeric-cell">WPA</th>       
              </tr>
            </thead>
            <tbody>
              ${pitchers.map((row, index) => $h`
                <tr class="${vm.teamInfo.currentPitcherId == row.player._id && (vm.isTopInning && vm.homeaway == 'HOME' || !vm.isTopInning && vm.homeaway == 'AWAY') && !vm.isComplete ? $h`pitching` : $h``}">
                  <td class="image">
                    <span class="icon">
                      <img src="/player/image/${row.player._id}" />

                    </span>
                  </td>

                  <td class="name">
                    ${row.subNumber ? $h`${row.subNumber}-` : $h``}
                    <a href="${universeWebService.startDateLink(`/p/${row.player._id}`)}">${row.player.fullName}</a>
                  </td>

                  <td class="pos">${row.player.currentPosition}</td>
                  <td class="numeric-cell">${row.player.pitchResult.wins}</td>
                  <td class="numeric-cell">${row.player.pitchResult.losses}</td>
                  <td class="numeric-cell">${row.player.pitchResult.ip}</td>
                  <td class="numeric-cell">${row.player.pitchResult.hits}</td>
                  <td class="numeric-cell">${row.player.pitchResult.runs}</td>
                  <td class="numeric-cell">${row.player.pitchResult.er}</td>
                  <td class="numeric-cell">${row.player.pitchResult.homeRuns}</td>
                  <td class="numeric-cell">${row.player.pitchResult.bb}</td>
                  <td class="numeric-cell">${row.player.pitchResult.so}</td>
                  <td class="numeric-cell">${row.player.pitchResult.hbp}</td>
                  <td class="numeric-cell">${row.player.pitchResult.battersFaced}</td>
                  <td class="numeric-cell">${row.player.pitchResult.pitches}</td>
                  <td class="numeric-cell">${row.player.pitchResult.strikes}</td>
                  <td class="numeric-cell">${row.player.pitchResult.wpa?.toFixed(2)}</td>
                </tr>
              `)}
            </tbody>                            
          </table>
        </div>

        <div class="batter-summary">
          ${doubles?.length > 0 ? $h`<strong>2B:</strong> ${arrayToStr(doubles)}<br />` : $h``}
          ${triples?.length > 0 ? $h`<strong>3B:</strong> ${arrayToStr(triples)}<br />` : $h``}
          ${hr?.length > 0 ? $h`<strong>HR:</strong> ${arrayToStr(hr)}<br />` : $h``}
          ${tb?.length > 0 ? $h`<strong>TB:</strong> ${arrayToStr(tb)}<br />` : $h``}
          ${rbi?.length > 0 ? $h`<strong>RBI:</strong> ${arrayToStr(rbi)}<br />` : $h``}
        </div>

    </div>`

  }


  export default (props, { $on, $, $f7, $update, $ref }) => {

    let env = ContainerService.getInstance("env")()
    let eventTarget = ContainerService.getInstance("eventTarget")

    let gameWebService = ContainerService.getInstance(GameWebService)
    let universeWebService = ContainerService.getInstance(UniverseWebService)
    let teamWebService = ContainerService.getInstance(TeamWebService)
    let quillWebService = ContainerService.getInstance(QuillWebService)

    let gameViewModel = props.gameViewModel

    console.log(gameViewModel)

    let summary = props.summary

    let linescoreViewModel = gameViewModel.linescoreViewModel
    let awayBoxscoreViewModel = gameViewModel.awayBoxscoreViewModel
    let homeBoxscoreViewModel = gameViewModel.homeBoxscoreViewModel

    const getAwayBoxscoreViewModel = () => { return awayBoxscoreViewModel }
    const getHomeBoxscoreViewModel = () => { return homeBoxscoreViewModel }

    const getFontColor = (bgColor) => {
      return gameWebService.useDarkFont(bgColor) ? "#000000" : "#ffffff"
    }

    $on('pageBeforeIn', async (e) => {
                    

      await $update()

      if (gameViewModel.linescoreViewModel) {

          eventTarget.dispatchEvent(new CustomEvent('main-nav', {
              detail: { tabLink: "/games", breadcrumbs:[], visible: false }
          }))


          universeWebService.setMetadata(
              `${gameViewModel.game.away.cityName ? gameViewModel.game.away.cityName : ''} ${gameViewModel.game.away.name} @ ${gameViewModel.game.home.cityName ? gameViewModel.game.home.cityName : ''} ${gameViewModel.game.home.name} on ${dayjs(gameViewModel.game.gameDate).format("YYYY-MM-DD")}- Ethereum Baseball League`, 
              window.location.href, 
              `${env.WEB}/logo.png`, 
              `${gameViewModel.game.away.cityName ? gameViewModel.game.away.cityName : ''} ${gameViewModel.game.away.name} @ ${gameViewModel.game.home.cityName ? gameViewModel.game.home.cityName : ''} ${gameViewModel.game.home.name} on ${dayjs(gameViewModel.game.gameDate).format("YYYY-MM-DD")}`
          ) 

      }


    })



    return $render

  }
</script>
